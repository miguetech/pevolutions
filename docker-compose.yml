services:
  # ----------------------------------------------------
  # Base de Datos MySQL
  # ----------------------------------------------------
  db:
    image: mysql:8.0
    container_name: pevolutions_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: pevolutions_db
      MYSQL_USER: pevolutions_user
      MYSQL_PASSWORD: pevolutions_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pevolutions_net

  # ----------------------------------------------------
  # Backend FastAPI
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pevolutions_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://pevolutions_user:pevolutions_password@db:3306/pevolutions_db
      SECRET_KEY: ${BACKEND_SECRET_KEY:-default_secret_key_change_in_production_min_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_URL: http://localhost:4321
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "False"
    ports:
      - "8000:8000"
    networks:
      - pevolutions_net

  # ----------------------------------------------------
  # Frontend Astro (Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: http://localhost:8000
    container_name: pevolutions_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4321:4321"
    networks:
      - pevolutions_net

networks:
  pevolutions_net:
    driver: bridge

volumes:
  mysql_data:
